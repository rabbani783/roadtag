<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asti RoadTag | Admin Panel</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --sidebar-w: 280px;
            --primary-dark: #1a2a6c;
            --accent-blue: #0052cc;
            --success-green: #107c10;
            --danger-red: #d11a2a;
            --bg-light: #f4f7f9;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-light); color: #222; display: flex; min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-w); background: var(--primary-dark);
            color: white; height: 100vh; position: fixed; left: 0;
            transition: 0.3s ease; display: flex; flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1); z-index: 1000;
        }
        body.menu-closed .sidebar { transform: translateX(-100%); }
        body.menu-closed .main-content { margin-left: 0; width: 100%; }

        .sidebar-header { padding: 30px 20px; background: rgba(0,0,0,0.2); text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .nav-item {
            padding: 18px 25px; cursor: pointer; color: #cbd5e0;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1rem; font-weight: 600;
            display: flex; align-items: center; gap: 12px;
        }
        .nav-item:hover, .nav-item.active { color: white; background: var(--accent-blue); }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: var(--sidebar-w); width: calc(100% - var(--sidebar-w));
            padding: 40px; transition: all 0.3s ease; box-sizing: border-box;
        }

        .top-row { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .burger-btn { background: var(--primary-dark); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        .search-bar { padding: 12px 20px; width: 100%; max-width: 450px; border: 2px solid #cbd5e0; border-radius: 10px; font-size: 1rem; }

        /* --- TABLE --- */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #f8fafc; padding: 15px; text-align: left; font-size: 0.75rem; color: #444; text-transform: uppercase; border-bottom: 3px solid #e2e8f0; cursor: pointer; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 1rem; vertical-align: middle; }
        
        .coord-link { color: var(--accent-blue); font-family: monospace; font-size: 0.85rem; text-decoration: none; font-weight: bold; }
        .coord-link:hover { text-decoration: underline; }

        .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-success { background: var(--success-green); color: white; }
        .btn-danger { background: white; color: var(--danger-red); border: 1px solid var(--danger-red); }

        .badge { padding: 4px 8px; border-radius: 4px; font-weight: 800; font-size: 0.75rem; }
        .badge-urgent { background: #fee2e2; color: #b91c1c; }
        .badge-fixed { background: #dcfce7; color: #15803d; }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="lightbox" onclick="this.style.display='none'"><img id="fullPhoto" src="" style="max-width: 90%; max-height: 90%; border: 4px solid white; border-radius: 10px;"></div>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2>Asti RoadTag</h2>
        <p style="font-size: 0.75rem; opacity: 0.7;">Gestione Tecnica</p>
    </div>
    <div class="nav-item active" onclick="filterBy('all', this)">📊 Tutti i Rapporti</div>
    <div class="nav-item" onclick="filterBy('pending', this)">⚠️ Da Riparare</div>
    <div class="nav-item" onclick="filterBy('resolved', this)">✅ Riparati</div>
    <div class="nav-item" onclick="exportExcel()" style="color: #4ade80; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">📥 Esporta Excel (.xlsx)</div>
    <div class="nav-item" onclick="window.open('index.html', '_blank')" style="margin-top: auto;">🚀 Vai alla Mappa</div>
</aside>

<main class="main-content">
    <div class="top-row">
        <button class="burger-btn" onclick="document.body.classList.toggle('menu-closed')">☰ Menu</button>
        <input type="text" id="searchInput" class="search-bar" placeholder="Cerca via o coordinate..." onkeyup="handleSearch()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Foto</th>
                    <th onclick="resortData('road')">Via ↕</th>
                    <th>Coordinate (Lat, Lng)</th>
                    <th onclick="resortData('timestamp')">Data ↕</th>
                    <th onclick="resortData('status')">Stato ↕</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</main>
