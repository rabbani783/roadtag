<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asti RoadTag | Admin Console</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --sidebar-width: 260px;
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
        }

        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text-main); margin: 0; display: flex; }

        /* Sidebar Navigation */
        .sidebar { width: var(--sidebar-width); height: 100vh; background: #0f172a; color: white; position: fixed; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 40px; color: var(--success); display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px 15px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }
        .nav-item.active { background: var(--primary); }

        /* Main Content Area */
        .main-content { margin-left: var(--sidebar-width); width: calc(100% - var(--sidebar-width)); padding: 40px; box-sizing: border-box; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-box { background: white; border: 1px solid #e2e8f0; padding: 10px 20px; border-radius: 10px; width: 300px; }

        /* Professional Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-left: 5px solid var(--primary); }
        .stat-card.urgent { border-left-color: var(--danger); }
        .stat-card.fixed { border-left-color: var(--success); }
        .stat-card span { font-size: 0.875rem; color: var(--text-muted); font-weight: 600; }
        .stat-card p { font-size: 1.875rem; font-weight: 700; margin: 10px 0 0; }

        /* Table Design */
        .data-table-container { background: white; border-radius: 15px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 15px 20px; text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); cursor: pointer; }
        th:hover { background: #e2e8f0; }
        td { padding: 18px 20px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-pending { background: #fef2f2; color: #dc2626; }
        .badge-resolved { background: #f0fdf4; color: #16a34a; }

        .img-preview { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 1px solid #e2e8f0; }
        
        /* Action Buttons */
        .action-btns { display: flex; gap: 8px; }
        .btn { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s; }
        .btn-resolve { background: var(--success); color: white; }
        .btn-delete { background: #fee2e2; color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* Lightbox */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.9); z-index: 9999; justify-content: center; align-items: center; }
        #lightbox img { max-width: 85%; max-height: 85%; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="lightbox" onclick="this.style.display='none'"><img id="fullPhoto" src=""></div>

    <aside class="sidebar">
        <h2><span>📍</span> RoadTag Asti</h2>
        <div class="nav-item active" onclick="filterBy('all')">📊 All Reports</div>
        <div class="nav-item" onclick="filterBy('pending')">⚠️ Active Hazards</div>
        <div class="nav-item" onclick="filterBy('resolved')">✅ Resolved</div>
        <div class="nav-item" onclick="window.location.href='index.html'" style="margin-top: 50px; color: #94a3b8;">⬅ Back to Map</div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1>Analytics Overview</h1>
            <input type="text" id="searchInput" class="search-box" placeholder="Search by street name..." onkeyup="handleSearch()">
        </div>

        <div class="stats-grid">
            <div class="stat-card urgent"><span>Active Issues</span><p id="stat-pending">0</p></div>
            <div class="stat-card fixed"><span>Resolved in Asti</span><p id="stat-resolved">0</p></div>
            <div class="stat-card"><span>Total Reports</span><p id="stat-total">0</p></div>
        </div>

        <div class="data-table-container">
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th onclick="sortTable(1)">Location ↕</th>
                        <th onclick="sortTable(2)">Note</th>
                        <th onclick="sortTable(3)">Date ↕</th>
                        <th onclick="sortTable(4)">Status ↕</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
        authDomain: "italy-road-reporter.firebaseapp.com",
        projectId: "italy-road-reporter",
        databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
        storageBucket: "italy-road-reporter.firebasestorage.app",
        messagingSenderId: "480453082341",
        appId: "1:480453082341:web:7cd51e2256747f1003280c"
    };

    firebase.initializeApp(firebaseConfig);
    const reportsRef = firebase.database().ref('reports');
    let allData = [];

    function fetchData() {
        reportsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            allData = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
            renderTable(allData);
            updateStats();
        });
    }

    function renderTable(list) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = list.map(item => {
            const isResolved = item.status === 'resolved';
            return `
                <tr>
                    <td>${item.image ? `<img src="${item.image}" class="img-preview" onclick="openLightBox(this.src)">` : 'No Image'}</td>
                    <td><b>${item.road}</b></td>
                    <td>${item.note || '-'}</td>
                    <td>${new Date(item.timestamp).toLocaleDateString('it-IT')}</td>
                    <td><span class="badge ${isResolved ? 'badge-resolved' : 'badge-pending'}">${isResolved ? 'RESOLVED' : 'PENDING'}</span></td>
                    <td class="action-btns">
                        ${!isResolved ? `<button class="btn btn-resolve" onclick="setStatus('${item.id}', 'resolved')">Resolve</button>` : ''}
                        <button class="btn btn-delete" onclick="deleteEntry('${item.id}')">Delete</button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function updateStats() {
        const pending = allData.filter(i => i.status !== 'resolved').length;
        const resolved = allData.filter(i => i.status === 'resolved').length;
        document.getElementById('stat-pending').innerText = pending;
        document.getElementById('stat-resolved').innerText = resolved;
        document.getElementById('stat-total').innerText = allData.length;
    }

    function handleSearch() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allData.filter(item => item.road.toLowerCase().includes(term));
        renderTable(filtered);
    }

    function filterBy(type) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        event.target.classList.add('active');
        if(type === 'all') renderTable(allData);
        else renderTable(allData.filter(i => type === 'resolved' ? i.status === 'resolved' : i.status !== 'resolved'));
    }

    function setStatus(id, status) {
        const secret = prompt("Admin Password:");
        if (secret === "Asti123") reportsRef.child(id).update({ status });
    }

    function deleteEntry(id) {
        const secret = prompt("Type password to DELETE permanently:");
        if (secret === "Asti123") reportsRef.child(id).remove();
    }

    function openLightBox(src) {
        document.getElementById('fullPhoto').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    // Basic Table Sort
    function sortTable(n) {
        // Implementation for quick sorting by columns...
        const sorted = [...allData].sort((a, b) => {
            if (n === 1) return a.road.localeCompare(b.road);
            if (n === 3) return b.timestamp - a.timestamp;
            if (n === 4) return (a.status || "").localeCompare(b.status || "");
            return 0;
        });
        renderTable(sorted);
    }

    fetchData();
</script>
</body>
</html>
