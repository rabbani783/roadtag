<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asti RoadTag | Professional Admin</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --apple-bg: #F5F5F7;
            --apple-card: #FFFFFF;
            --apple-blue: #007AFF;
            --apple-gray: #86868B;
            --apple-danger: #FF3B30;
            --apple-success: #34C759;
            --sidebar-w: 280px;
        }

        body { 
            margin: 0; font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--apple-bg); color: #1D1D1F; display: flex;
            transition: 0.3s ease-in-out;
        }

        /* --- APPLE SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-w); background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); height: 100vh; position: fixed; left: 0;
            border-right: 1px solid #D2D2D7; display: flex; flex-direction: column;
            z-index: 1000; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.menu-closed .sidebar { transform: translateX(-100%); }
        body.menu-closed .main-content { margin-left: 0; width: 100%; }

        .sidebar-header { padding: 40px 30px; font-weight: 700; font-size: 1.5rem; letter-spacing: -0.5px; }
        
        .nav-item {
            padding: 14px 24px; margin: 4px 16px; border-radius: 12px; cursor: pointer;
            color: #424245; font-weight: 500; transition: 0.2s;
        }
        .nav-item.active { background: var(--apple-blue); color: white; }
        .nav-item:hover:not(.active) { background: rgba(0,0,0,0.05); }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: var(--sidebar-w); width: calc(100% - var(--sidebar-w));
            padding: 40px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .apple-toolbar {
            display: flex; align-items: center; gap: 20px; margin-bottom: 30px;
            background: var(--apple-card); padding: 15px 25px; border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.04);
        }

        .search-input {
            flex: 1; border: none; background: #F2F2F7; padding: 12px 20px;
            border-radius: 12px; font-size: 1rem; outline: none;
        }

        /* --- ACCESSIBLE TABLE --- */
        .card-table {
            background: var(--apple-card); border-radius: 22px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08); overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        th { 
            background: #FAFAFB; padding: 20px; text-align: left; 
            font-size: 0.8rem; color: var(--apple-gray); text-transform: uppercase;
            letter-spacing: 1px; border-bottom: 1px solid #F2F2F7;
        }

        /* SORT BUTTONS */
        .sort-btn {
            background: #E8E8ED; border: none; padding: 4px 10px; border-radius: 6px;
            font-size: 0.7rem; cursor: pointer; margin-left: 5px; color: #1D1D1F;
        }

        /* ROW STABILITY */
        tr { height: 90px; transition: background 0.2s; }
        tr:hover { background: #FBFBFC; }
        td { padding: 0 20px; border-bottom: 1px solid #F2F2F7; font-size: 1.1rem; }

        .img-placeholder {
            width: 60px; height: 60px; background: #F2F2F7; 
            border-radius: 12px; display: flex; align-items: center; 
            justify-content: center; color: #D2D2D7; font-size: 0.8rem;
        }

        /* ACTIONS */
        .action-box { display: flex; gap: 12px; justify-content: flex-end; align-items: center; width: 120px; }
        .apple-btn {
            height: 44px; width: 50px; border-radius: 12px; border: none;
            font-weight: 600; cursor: pointer; transition: transform 0.1s;
        }
        .apple-btn:active { transform: scale(0.95); }
        .btn-ok { background: var(--apple-success); color: white; }
        .btn-x { background: #F2F2F7; color: var(--apple-danger); }

        .badge {
            padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 0.85rem;
        }
        .badge-active { background: #FFF2F2; color: var(--apple-danger); }
        .badge-fixed { background: #F2FBF2; color: var(--apple-success); }

        /* PAGINATION */
        .apple-pager {
            display: flex; justify-content: space-between; align-items: center; margin-top: 30px;
        }
        .page-link {
            padding: 10px 18px; border-radius: 10px; background: white; border: 1px solid #D2D2D7;
            cursor: pointer; font-weight: 600;
        }
        .page-link.active { background: var(--apple-blue); color: white; border-color: var(--apple-blue); }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header">RoadTag <span style="color:var(--apple-blue)">Asti</span></div>
    <div class="nav-item active" onclick="setFilter('all', this)">📊 Tutti i Rapporti</div>
    <div class="nav-item" onclick="setFilter('pending', this)">⚠️ Pericoli Attivi</div>
    <div class="nav-item" onclick="setFilter('resolved', this)">✅ Lavori Risolti</div>
    <div style="margin-top:auto; padding: 20px;">
        <div class="nav-item" onclick="exportExcel()" style="background:#E8E8ED; color:var(--apple-blue)">📥 Esporta Report</div>
    </div>
</aside>

<main class="main-content">
    <div class="apple-toolbar">
        <button class="page-link" onclick="document.body.classList.toggle('menu-closed')">☰</button>
        <input type="text" id="searchInput" class="search-input" placeholder="Cerca via..." onkeyup="updateTable()">
        <input type="date" id="dateInput" class="search-input" style="max-width:200px" onchange="updateTable()">
        <select id="rowsPerPage" class="search-input" style="max-width:120px" onchange="currentPage=1; updateTable()">
			<option value="05">05 Righe</option>
			<option value="10">10 Righe</option>
			<option value="20">20 Righe</option>
            <option value="50">50 Righe</option>
            <option value="100">100 Righe</option>
        </select>
    </div>

    <div class="card-table">
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">Foto</th>
                    <th>Via <button class="sort-btn" onclick="setSort('road')">↕</button></th>
                    <th style="width: 150px;">Data <button class="sort-btn" onclick="setSort('timestamp')">↕</button></th>
                    <th style="width: 150px;">Stato <button class="sort-btn" onclick="setSort('status')">↕</button></th>
                    <th style="width: 150px; text-align:right;">Azioni</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="apple-pager">
        <div id="pageInfo" style="color: var(--apple-gray); font-weight: 500;"></div>
        <div id="pageNumbers" style="display:flex; gap:8px;"></div>
    </div>
</main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
        authDomain: "italy-road-reporter.firebaseapp.com",
        projectId: "italy-road-reporter",
        databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
        storageBucket: "italy-road-reporter.firebasestorage.app",
        messagingSenderId: "480453082341",
        appId: "1:480453082341:web:7cd51e2256747f1003280c"
    };

    firebase.initializeApp(firebaseConfig);
    const reportsRef = firebase.database().ref('reports');

    let masterData = [];
    let currentFilter = 'all';
    let currentPage = 1;
    let currentSort = { key: 'timestamp', asc: false };

    function init() {
        reportsRef.on('value', snap => {
            const val = snap.val();
            masterData = val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : [];
            updateTable();
        });
    }

    function setSort(key) {
        currentSort.asc = (currentSort.key === key) ? !currentSort.asc : true;
        currentSort.key = key;
        updateTable();
    }

    function updateTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const dateVal = document.getElementById('dateInput').value;
        const rows = parseInt(document.getElementById('rowsPerPage').value);

        let data = masterData.filter(i => {
            const mSearch = i.road.toLowerCase().includes(query);
            const mStatus = (currentFilter === 'all') || (currentFilter === 'resolved' ? i.status === 'resolved' : i.status !== 'resolved');
            const mDate = !dateVal || (new Date(i.timestamp).toISOString().split('T')[0] === dateVal);
            return mSearch && mStatus && mDate;
        });

        data.sort((a,b) => {
            let v1 = a[currentSort.key] || '', v2 = b[currentSort.key] || '';
            return currentSort.asc ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
        });

        const total = data.length;
        const pages = Math.ceil(total / rows);
        const start = (currentPage - 1) * rows;
        
        render(data.slice(start, start + rows));
        renderPager(total, pages);
    }

    function render(list) {
        document.getElementById('tableBody').innerHTML = list.map(item => `
            <tr>
                <td>
                    ${item.image ? 
                        `<img src="${item.image}" class="img-placeholder" style="cursor:pointer" onclick="window.open('${item.image}')">` : 
                        `<div class="img-placeholder">N/A</div>`
                    }
                </td>
                <td>
                    <div style="font-weight:700; color:#1D1D1F">${item.road}</div>
                    <div style="font-size:0.85rem; color:var(--apple-gray)">${item.lat.toFixed(4)}, ${item.lng.toFixed(4)}</div>
                </td>
                <td style="color:var(--apple-gray); font-weight:500">${new Date(item.timestamp).toLocaleDateString('it-IT')}</td>
                <td>
                    <span class="badge ${item.status==='resolved'?'badge-fixed':'badge-active'}">
                        ${item.status==='resolved'?'RISOLTO':'ATTIVO'}
                    </span>
                </td>
                <td>
                    <div class="action-box">
                        <div style="width:50px">
                            ${item.status !== 'resolved' ? `<button class="apple-btn btn-ok" onclick="act('${item.id}','upd')">OK</button>` : ''}
                        </div>
                        <button class="apple-btn btn-x" onclick="act('${item.id}','del')">✕</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function renderPager(total, pages) {
        document.getElementById('pageInfo').innerText = `Mostrando ${total} segnalazioni`;
        let html = "";
        for(let i=1; i<=pages; i++) {
            html += `<button class="page-link ${i===currentPage?'active':''}" onclick="currentPage=${i}; updateTable()">${i}</button>`;
        }
        document.getElementById('pageNumbers').innerHTML = html;
    }

    function act(id, type) {
        if(prompt("Password Admin:") !== "Asti123") return;
        if(type === 'upd') reportsRef.child(id).update({status:'resolved'});
        else if(confirm("Eliminare?")) reportsRef.child(id).remove();
    }

    function setFilter(t, el) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        currentFilter = t; currentPage = 1; updateTable();
    }

    function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(masterData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Asti_Reports");
        XLSX.writeFile(wb, "Report_RoadTag_Asti.xlsx");
    }

    init();
</script>
</body>
</html>
