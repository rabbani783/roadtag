<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Asti RoadTag | Admin Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a2a6c; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .status-msg { padding: 10px; margin-bottom: 20px; border-radius: 5px; background: #fff3cd; color: #856404; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #eef2f7; cursor: pointer; }
        .btn-excel { background: #107c10; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Asti RoadTag Admin</h1>
        <div id="debug-status" class="status-msg">In attesa di connessione al database...</div>
        
        <button class="btn-excel" onclick="exportExcel()">Scarica Report Excel</button>
        <input type="text" id="search" placeholder="Cerca via..." onkeyup="doSearch()" style="padding:10px; margin-left:10px; width:250px;">

        <table id="myTable">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th onclick="sortTable(1)">Via ↕</th>
                    <th onclick="sortTable(2)">Data ↕</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
        authDomain: "italy-road-reporter.firebaseapp.com",
        projectId: "italy-road-reporter",
        databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
        storageBucket: "italy-road-reporter.firebasestorage.app",
        messagingSenderId: "480453082341",
        appId: "1:480453082341:web:7cd51e2256747f1003280c"
    };

    // Initialize Firebase with error catching
    try {
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('reports');
        document.getElementById('debug-status').innerText = "Connesso! Caricamento dati di Asti...";

        db.on('value', snap => {
            const data = snap.val();
            if(!data) {
                document.getElementById('debug-status').innerText = "Nessun dato trovato nel database.";
                return;
            }
            const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            renderTable(list);
            document.getElementById('debug-status').style.display = "none";
        }, err => {
            document.getElementById('debug-status').innerText = "Errore Database: " + err.message;
            document.getElementById('debug-status').style.background = "#f8d7da";
        });
    } catch (e) {
        document.getElementById('debug-status').innerText = "Errore Critico: " + e.message;
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.reverse().map(item => `
            <tr>
                <td><img src="${item.image}" width="50" style="border-radius:5px"></td>
                <td><strong>${item.road}</strong><br><small>${item.note || ''}</small></td>
                <td>${new Date(item.timestamp).toLocaleDateString()}</td>
                <td>${item.status === 'resolved' ? '✅' : '⚠️'}</td>
                <td><button onclick="deleteRep('${item.id}')">Elimina</button></td>
            </tr>
        `).join('');
    }

    // Add search/sort/excel functions here...
    function exportExcel() {
        // Excel logic...
    }
</script>
</body>
</html>
