<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asti RoadTag | Admin Panel</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --sidebar-w: 280px;
            --primary-dark: #1a2a6c;
            --accent-blue: #0052cc;
            --success-green: #107c10;
            --danger-red: #d11a2a;
            --bg-light: #f4f7f9;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-light); color: #222; display: flex; min-height: 100vh;
        }

        /* --- SIDEBAR (Push Layout) --- */
        .sidebar {
            width: var(--sidebar-w); background: var(--primary-dark);
            color: white; height: 100vh; position: fixed; left: 0;
            transition: 0.3s ease; display: flex; flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1); z-index: 1000;
        }
        body.menu-closed .sidebar { transform: translateX(-100%); }
        body.menu-closed .main-content { margin-left: 0; width: 100%; }

        .sidebar-header { padding: 30px 20px; background: rgba(0,0,0,0.2); text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .nav-item {
            padding: 20px 25px; cursor: pointer; color: #cbd5e0;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1.1rem; font-weight: 600;
            display: flex; align-items: center; gap: 15px; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { color: white; background: var(--accent-blue); }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: var(--sidebar-w); width: calc(100% - var(--sidebar-w));
            padding: 40px; transition: all 0.3s ease; box-sizing: border-box;
        }

        .top-row { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .burger-btn { background: var(--primary-dark); color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
        .search-bar { padding: 15px 20px; width: 100%; max-width: 500px; border: 2px solid #cbd5e0; border-radius: 10px; font-size: 1.1rem; }

        /* --- STATS --- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 8px solid var(--accent-blue); }
        .stat-card span { font-size: 0.9rem; font-weight: bold; color: #666; text-transform: uppercase; }
        .stat-card p { font-size: 2.5rem; font-weight: 800; margin: 5px 0 0; }

        /* --- TABLE --- */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 20px; text-align: left; font-size: 0.85rem; color: #444; text-transform: uppercase; border-bottom: 3px solid #e2e8f0; cursor: pointer; }
        td { padding: 20px; border-bottom: 1px solid #f1f5f9; font-size: 1.1rem; vertical-align: middle; }
        tr:hover { background: #fdfdfd; }

        .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-success { background: var(--success-green); color: white; }
        .btn-danger { background: #fff; color: var(--danger-red); border: 2px solid var(--danger-red); }

        .badge { padding: 6px 12px; border-radius: 6px; font-weight: 800; font-size: 0.8rem; }
        .badge-urgent { background: #fee2e2; color: #b91c1c; }
        .badge-fixed { background: #dcfce7; color: #15803d; }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
    </style>
</head>
<body>
