<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asti RoadTag | Glass Console</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --primary: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
            background-attachment: fixed;
            color: white; 
            display: flex;
            min-height: 100vh;
        }

        /* Glass Sidebar */
        .sidebar {
            width: 260px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            height: 100vh;
            position: fixed;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        body.collapsed .sidebar { width: 80px; }
        body.collapsed .nav-text, body.collapsed h2 { display: none; }

        .nav-item {
            padding: 18px 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255,255,255,0.7);
            transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active {
            color: white;
            background: rgba(255,255,255,0.1);
            border-left: 4px solid var(--primary);
        }

        /* Main Content Area */
        .main-content {
            margin-left: 260px;
            width: calc(100% - 260px);
            padding: 40px;
            transition: 0.3s;
        }
        body.collapsed .main-content { margin-left: 80px; width: calc(100% - 80px); }

        /* Glass Cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-val { font-size: 2rem; font-weight: 800; margin: 5px 0; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 15px; border-bottom: 1px solid var(--glass-border); font-size: 0.8rem; text-transform: uppercase; color: rgba(255,255,255,0.5); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4); }
        .btn-excel { background: var(--success); }

        .badge { padding: 5px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 800; }
        .badge-pending { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-fixed { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }

        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="lightbox" onclick="this.style.display='none'"><img id="fullPhoto" src="" style="max-width: 90%; border-radius: 15px;"></div>

<aside class="sidebar">
    <div style="padding: 30px 25px;">
        <h2 style="color: var(--primary);">RoadTag <span style="color: white;">Asti</span></h2>
    </div>
    <div class="nav-item active" onclick="filterData('all')">📊 All Reports</div>
    <div class="nav-item" onclick="filterData('pending')">⚠️ Pending</div>
    <div class="nav-item" onclick="filterData('resolved')">✅ Resolved</div>
    <div class="nav-item" onclick="window.open('index.html', '_blank')" style="margin-top: auto;">🚀 Open App</div>
    <div class="nav-item" onclick="document.body.classList.toggle('collapsed')">↔️ Collapse</div>
</aside>

<main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h1>Admin Dashboard</h1>
        <button class="btn btn-excel" onclick="exportToExcel()">📊 Download Excel Report</button>
    </div>

    <div class="stats-grid glass-card">
        <div><span>Total Hazards</span><div class="stat-val" id="count-total">0</div></div>
        <div><span>Active</span><div class="stat-val" style="color: var(--danger)" id="count-pending">0</div></div>
        <div><span>Fixed</span><div class="stat-val" style="color: var(--success)" id="count-fixed">0</div></div>
    </div>

    <div class="glass-card" style="padding: 0; overflow: hidden;">
        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Location</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
        authDomain: "italy-road-reporter.firebaseapp.com",
        projectId: "italy-road-reporter",
        databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
        storageBucket: "italy-road-reporter.firebasestorage.app",
        messagingSenderId: "480453082341",
        appId: "1:480453082341:web:7cd51e2256747f1003280c"
    };

    firebase.initializeApp(firebaseConfig);
    const reportsRef = firebase.database().ref('reports');
    let masterData = [];

    function init() {
        reportsRef.on('value', (snapshot) => {
            const val = snapshot.val();
            masterData = val ? Object.keys(val).map(key => ({ id: key, ...val[key] })).reverse() : [];
            updateUI(masterData);
        });
    }

    function updateUI(list) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = list.map(item => {
            const isFixed = item.status === 'resolved';
            return `
                <tr>
                    <td>${item.image ? `<img src="${item.image}" style="width:45px;height:45px;border-radius:10px;cursor:pointer" onclick="viewPhoto('${item.image}')">` : '—'}</td>
                    <td><div style="font-weight:600">${item.road}</div><div style="font-size:0.7rem;opacity:0.6">${item.note || ''}</div></td>
                    <td>${new Date(item.timestamp).toLocaleDateString()}</td>
                    <td><span class="badge ${isFixed ? 'badge-fixed' : 'badge-pending'}">${isFixed ? 'FIXED' : 'ACTIVE'}</span></td>
                    <td>
                        ${!isFixed ? `<button class="btn" style="padding:5px 10px;font-size:0.7rem" onclick="markFixed('${item.id}')">Resolve</button>` : ''}
                        <button onclick="deleteEntry('${item.id}')" style="background:none;border:none;color:var(--danger);cursor:pointer;margin-left:10px">🗑️</button>
                    </td>
                </tr>
            `;
        }).join('');

        document.getElementById('count-total').innerText = masterData.length;
        document.getElementById('count-pending').innerText = masterData.filter(i => i.status !== 'resolved').length;
        document.getElementById('count-fixed').innerText = masterData.filter(i => i.status === 'resolved').length;
    }

    function exportToExcel() {
        const rows = masterData.map(item => ({
            "Street Name": item.road,
            "Notes": item.note,
            "Date Reported": new Date(item.timestamp).toLocaleString(),
            "Status": item.status === 'resolved' ? "Fixed" : "Pending",
            "Latitude": item.lat,
            "Longitude": item.lng
        }));

        const worksheet = XLSX.utils.json_to_sheet(rows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Asti Road Hazards");
        XLSX.writeFile(workbook, "Asti_Road_Report_" + new Date().toLocaleDateString() + ".xlsx");
    }

    function markFixed(id) {
        if (prompt("Password:") === "Asti123") reportsRef.child(id).update({ status: 'resolved' });
    }

    function deleteEntry(id) {
        if (prompt("Type 'DELETE' to confirm:") === "Asti123") reportsRef.child(id).remove();
    }

    function viewPhoto(src) {
        document.getElementById('fullPhoto').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    init();
</script>
</body>
</html>
