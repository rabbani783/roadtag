<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asti RoadTag | Admin Panel</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --sidebar-w: 260px;
            --primary-dark: #1a2a6c;
            --accent-blue: #0052cc;
            --success-green: #107c10;
            --danger-red: #d11a2a;
            --bg-light: #f4f7f9;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg-light); color: #333; display: flex; min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- RESPONSIVE SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-w); background: var(--primary-dark);
            color: white; height: 100vh; position: fixed; left: 0;
            transition: 0.3s ease; display: flex; flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1); z-index: 1000;
        }

        /* Mobile State: Sidebar hidden by default */
        @media (max-width: 768px) {
            .sidebar { left: -260px; }
            body.menu-open .sidebar { left: 0; }
            .main-content { margin-left: 0 !important; width: 100% !important; }
        }

        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .nav-item {
            padding: 18px 25px; cursor: pointer; color: #cbd5e0;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 600;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { color: white; background: var(--accent-blue); }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: var(--sidebar-w); width: calc(100% - var(--sidebar-w));
            padding: 20px; transition: all 0.3s ease; box-sizing: border-box;
        }

        .top-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .burger-btn { background: var(--primary-dark); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; display: block; }
        .search-bar { flex-grow: 1; padding: 12px; border: 2px solid #cbd5e0; border-radius: 10px; font-size: 1rem; min-width: 200px; }

        /* --- TABLE RESPONSIVENESS --- */
        .table-container { 
            background: white; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            overflow-x: auto; /* Allows sliding on mobile */
            -webkit-overflow-scrolling: touch;
        }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: #f8fafc; padding: 12px; text-align: left; font-size: 0.75rem; color: #444; text-transform: uppercase; border-bottom: 3px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
        
        /* Buttons */
        .btn { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .btn-success { background: var(--success-green); color: white; }
        .btn-danger { background: white; color: var(--danger-red); border: 1px solid var(--danger-red); }

        .badge { padding: 4px 8px; border-radius: 4px; font-weight: 800; font-size: 0.7rem; }
        .badge-urgent { background: #fee2e2; color: #b91c1c; }
        .badge-fixed { background: #dcfce7; color: #15803d; }

        /* Fullscreen Overlay */
        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        #lightbox img { max-width: 95%; max-height: 90%; object-fit: contain; }

        /* Overlay for mobile when menu is open */
        .overlay { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; 
        }
        body.menu-open .overlay { display: block; }
    </style>
</head>
<body>

<div id="lightbox" onclick="this.style.display='none'"><img id="fullPhoto" src=""></div>
<div class="overlay" onclick="document.body.classList.remove('menu-open')"></div>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0">RoadTag Asti</h2>
    </div>
    <div class="nav-item active" onclick="filterBy('all', this); closeMenu()">📊 Tutti i Rapporti</div>
    <div class="nav-item" onclick="filterBy('pending', this); closeMenu()">⚠️ Pericoli Attivi</div>
    <div class="nav-item" onclick="filterBy('resolved', this); closeMenu()">✅ Lavori Risolti</div>
    <div class="nav-item" onclick="exportExcel()" style="color: #4ade80; margin-top: 20px;">📥 Esporta Excel</div>
    <div class="nav-item" onclick="window.open('index.html', '_blank')" style="margin-top: auto;">🚀 Apri Mappa</div>
</aside>

<main class="main-content">
    <div class="top-row">
        <button class="burger-btn" onclick="document.body.classList.toggle('menu-open')">☰</button>
        <input type="text" id="searchInput" class="search-bar" placeholder="Cerca via..." onkeyup="handleSearch()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Via</th>
                    <th>Coordinate</th>
                    <th>Data</th>
                    <th>Stato</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
        authDomain: "italy-road-reporter.firebaseapp.com",
        projectId: "italy-road-reporter",
        databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
        storageBucket: "italy-road-reporter.firebasestorage.app",
        messagingSenderId: "480453082341",
        appId: "1:480453082341:web:7cd51e2256747f1003280c"
    };

    firebase.initializeApp(firebaseConfig);
    const reportsRef = firebase.database().ref('reports');
    let masterData = [];

    function init() {
        reportsRef.on('value', snap => {
            const val = snap.val();
            masterData = val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : [];
            render(masterData);
        });
    }

    function render(dataList) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = dataList.sort((a,b) => b.timestamp - a.timestamp).map(item => `
            <tr>
                <td><img src="${item.image}" width="50" style="border-radius:4px;" onclick="openPhoto('${item.image}')"></td>
                <td><strong>${item.road}</strong></td>
                <td><a href="https://www.google.com/maps?q=${item.lat},${item.lng}" target="_blank" style="font-size:0.8rem;">Mappa</a></td>
                <td>${new Date(item.timestamp).toLocaleDateString('it-IT')}</td>
                <td><span class="badge ${item.status==='resolved'?'badge-fixed':'badge-urgent'}">${item.status==='resolved'?'OK':'ATTIVO'}</span></td>
                <td style="width: 110px;">
                    <div style="display: flex; gap: 5px;">
                        <div style="width: 40px; height: 30px;">
                            ${item.status !== 'resolved' ? `<button class="btn btn-success" onclick="updateStatus('${item.id}', 'resolved')">OK</button>` : ''}
                        </div>
                        <button class="btn btn-danger" onclick="deleteItem('${item.id}')">X</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function closeMenu() { document.body.classList.remove('menu-open'); }

    function handleSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        render(masterData.filter(i => i.road.toLowerCase().includes(q)));
    }

    function filterBy(type, el) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        render(type === 'all' ? masterData : masterData.filter(i => type === 'resolved' ? i.status === 'resolved' : i.status !== 'resolved'));
    }

    function updateStatus(id, s) { if(prompt("Password:")==="Asti123") reportsRef.child(id).update({status:s}); }
    function deleteItem(id) { if(confirm("Elimina?") && prompt("Password:")==="Asti123") reportsRef.child(id).remove(); }
    function openPhoto(s) { document.getElementById('fullPhoto').src=s; document.getElementById('lightbox').style.display='flex'; }

    function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(masterData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Reports");
        XLSX.writeFile(wb, "Asti_Roads.xlsx");
    }

    init();
</script>
</body>
</html>
