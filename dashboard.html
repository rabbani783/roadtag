<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asti RoadTag | Pro Console</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --primary: #6366f1;
            --success: #10b981;
            --danger: #ef4444;
            --sidebar-w: 280px;
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            background-attachment: fixed; color: white; display: flex; min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- BURGER MENU & SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-w); background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border);
            height: 100vh; position: fixed; left: -280px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000; display: flex; flex-direction: column;
        }
        .sidebar.open { left: 0; }

        .burger-btn {
            position: fixed; top: 20px; left: 20px; z-index: 2100;
            background: var(--primary); border: none; color: white;
            width: 45px; height: 45px; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-item {
            padding: 20px 30px; cursor: pointer; color: rgba(255,255,255,0.6);
            transition: 0.3s; display: flex; align-items: center; gap: 15px; font-weight: 500;
        }
        .nav-item:hover, .nav-item.active { color: white; background: rgba(255,255,255,0.05); }

        /* --- MAIN CONTENT --- */
        .main-content {
            width: 100%; padding: 80px 40px 40px; transition: 0.4s;
        }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 30px; margin-bottom: 30px;
        }

        /* --- STATS & CONTROLS --- */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 20px; }
        .search-bar { 
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 12px 20px; border-radius: 12px; color: white; width: 300px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; }
        .stat-box h4 { margin: 0; font-size: 0.8rem; color: rgba(255,255,255,0.5); text-transform: uppercase; }
        .stat-box p { margin: 10px 0 0; font-size: 2rem; font-weight: 800; }

        /* --- TABLE --- */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { 
            text-align: left; padding: 15px; border-bottom: 1px solid var(--glass-border);
            font-size: 0.75rem; color: rgba(255,255,255,0.4); cursor: pointer; transition: 0.2s;
        }
        th:hover { color: var(--primary); }
        td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }

        .btn {
            padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer;
            font-weight: 600; transition: 0.3s; color: white; font-size: 0.85rem;
        }
        .btn-success { background: var(--success); }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: white; }

        #lightbox { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 3000; justify-content: center; align-items: center; 
        }
    </style>
</head>
<body>

<button class="burger-btn" onclick="toggleSidebar()">☰</button>

<div id="lightbox" onclick="this.style.display='none'"><img id="fullPhoto" src="" style="max-width: 85%; border-radius: 20px;"></div>

<aside class="sidebar" id="sidebar">
    <div style="padding: 40px 30px;">
        <h2 style="color: var(--primary); margin: 0;">RoadTag Admin</h2>
        <p style="font-size: 0.7rem; opacity: 0.5;">Provincia di Asti</p>
    </div>
    <div class="nav-item active" onclick="filterBy('all')">📊 All Data</div>
    <div class="nav-item" onclick="filterBy('pending')">⚠️ Urgent</div>
    <div class="nav-item" onclick="filterBy('resolved')">✅ Resolved</div>
    <div class="nav-item" onclick="exportToExcel()">📥 Export Excel</div>
    <div class="nav-item" onclick="window.open('index.html', '_blank')" style="margin-top: auto; border-top: 1px solid var(--glass-border);">🚀 View Map</div>
</aside>

<main class="main-content">
    <div class="header-row">
        <h1>Dashboard</h1>
        <input type="text" id="searchInput" class="search-bar" placeholder="Search street name..." onkeyup="handleSearch()">
    </div>

    <div class="glass-card stats-grid">
        <div class="stat-box"><h4>Active</h4><p id="count-pending" style="color:var(--danger)">0</p></div>
        <div class="stat-box"><h4>Resolved</h4><p id="count-fixed" style="color:var(--success)">0</p></div>
        <div class="stat-box"><h4>Total</h4><p id="count-total">0</p></div>
    </div>

    <div class="glass-card table-container">
        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th onclick="resortData('road')">Location ↕</th>
                    <th onclick="resortData('timestamp')">Date ↕</th>
                    <th onclick="resortData('status')">Status ↕</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
        authDomain: "italy-road-reporter.firebaseapp.com",
        projectId: "italy-road-reporter",
        databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
        storageBucket: "italy-road-reporter.firebasestorage.app",
        messagingSenderId: "480453082341",
        appId: "1:480453082341:web:7cd51e2256747f1003280c"
    };

    firebase.initializeApp(firebaseConfig);
    const reportsRef = firebase.database().ref('reports');
    let rawData = [];
    let currentSort = { key: 'timestamp', asc: false };

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    function init() {
        reportsRef.on('value', snap => {
            const val = snap.val();
            rawData = val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : [];
            processAndRender();
        });
    }

    function resortData(key) {
        currentSort.asc = currentSort.key === key ? !currentSort.asc : false;
        currentSort.key = key;
        processAndRender();
    }

    function processAndRender(list = rawData) {
        let displayList = [...list];
        
        // Sorting Logic
        displayList.sort((a, b) => {
            let v1 = a[currentSort.key], v2 = b[currentSort.key];
            if (currentSort.key === 'road') return currentSort.asc ? v1.localeCompare(v2) : v2.localeCompare(v1);
            return currentSort.asc ? v1 - v2 : v2 - v1;
        });

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = displayList.map(item => `
            <tr>
                <td>${item.image ? `<img src="${item.image}" style="width:40px;height:40px;border-radius:8px;cursor:pointer" onclick="viewImg('${item.image}')">` : '—'}</td>
                <td><b>${item.road}</b><br><small style="opacity:0.5">${item.note || ''}</small></td>
                <td>${new Date(item.timestamp).toLocaleDateString()}</td>
                <td><span style="color:${item.status==='resolved'?'#10b981':'#ef4444'}; font-weight:bold; font-size:0.7rem;">${item.status==='resolved'?'FIXED':'ACTIVE'}</span></td>
                <td>
                    ${item.status !== 'resolved' ? `<button class="btn btn-success" style="padding:5px 10px; font-size:0.7rem" onclick="actionStatus('${item.id}', 'resolved')">Resolve</button>` : ''}
                    <button class="btn btn-danger" style="padding:5px 10px; font-size:0.7rem" onclick="actionDelete('${item.id}')">Delete</button>
                </td>
            </tr>
        `).join('');

        updateCounters();
    }

    function updateCounters() {
        document.getElementById('count-total').innerText = rawData.length;
        document.getElementById('count-pending').innerText = rawData.filter(i => i.status !== 'resolved').length;
        document.getElementById('count-fixed').innerText = rawData.filter(i => i.status === 'resolved').length;
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = rawData.filter(i => i.road.toLowerCase().includes(query));
        processAndRender(filtered);
    }

    function filterBy(type) {
        toggleSidebar();
        if (type === 'all') processAndRender(rawData);
        else processAndRender(rawData.filter(i => type === 'resolved' ? i.status === 'resolved' : i.status !== 'resolved'));
    }

    function actionStatus(id, status) {
        if (prompt("Password:") === "Asti123") reportsRef.child(id).update({ status });
    }

    function actionDelete(id) {
        if (prompt("Type 'Asti123' to Delete:") === "Asti123") reportsRef.child(id).remove();
    }

    function viewImg(src) {
        document.getElementById('fullPhoto').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function exportToExcel() {
        const data = rawData.map(i => ({ Road: i.road, Note: i.note, Date: new Date(i.timestamp).toLocaleString(), Status: i.status || 'Active' }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Reports");
        XLSX.writeFile(wb, "Asti_Road_Reports.xlsx");
    }

    init();
</script>
</body>
</html>
