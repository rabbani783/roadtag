<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asti RoadTag | Console Amministrativa Professionale</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.css">
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --apple-bg: #F5F5F7;
            --apple-card: #FFFFFF;
            --apple-blue: #007AFF;
            --apple-danger: #FF3B30;
            --apple-success: #34C759;
            --sidebar-w: 280px;
            --row-h: 110px; /* Altezza fissa per stabilità UX */
        }

        body { 
            margin: 0; font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--apple-bg); color: #1D1D1F; display: flex;
            min-height: 100vh; overflow-x: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-w); background: #1D1D1F; color: white;
            height: 100vh; position: fixed; left: 0; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; z-index: 1000;
        }
        body.menu-closed .sidebar { transform: translateX(-100%); }
        body.menu-closed .main-content { margin-left: 0; width: 100%; }

        .sidebar-header { padding: 40px 30px; font-weight: 700; font-size: 1.4rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .nav-item {
            padding: 16px 24px; margin: 5px 15px; border-radius: 12px; cursor: pointer;
            transition: 0.2s; font-weight: 600;
        }
        .nav-item.active { background: var(--apple-blue); color: white; }
        .nav-item:hover:not(.active) { background: rgba(255,255,255,0.1); }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: var(--sidebar-w); width: calc(100% - var(--sidebar-w));
            padding: 30px; transition: 0.4s ease; box-sizing: border-box;
        }

        /* TOOLBAR - UX GRID */
        .toolbar {
            display: grid; grid-template-columns: auto 1.5fr 1fr auto auto;
            gap: 15px; align-items: center; margin-bottom: 25px;
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .input-box {
            padding: 12px 15px; border: 1.5px solid #D2D2D7; border-radius: 10px;
            font-size: 1rem; outline: none; background: #FFF; width: 100%; box-sizing: border-box;
        }

        /* --- TABLE DESIGN --- */
        .table-card {
            background: white; border-radius: 24px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        th { 
            background: #FAFAFB; padding: 20px; text-align: left; 
            font-size: 0.75rem; color: #86868B; text-transform: uppercase;
            border-bottom: 2px solid #F2F2F7;
        }

        .sort-btn { cursor: pointer; color: var(--apple-blue); font-weight: 900; margin-left: 5px; background: none; border: none; font-size: 1rem; }

        tr { height: var(--row-h); border-bottom: 1px solid #F2F2F7; }
        td { padding: 0 20px; vertical-align: middle; }

        .img-box {
            width: 80px; height: 80px; border-radius: 14px; background: #F2F2F7;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        /* ACTIONS - FIXED SLOTS */
        .action-cell { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
        .ui-btn {
            height: 44px; width: 50px; border-radius: 12px; border: none;
            font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-ok { background: var(--apple-success); color: white; }
        .btn-del { background: #F2F2F7; color: var(--apple-danger); }

        /* PAGER */
        .pager-row { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
        .page-link {
            padding: 10px 18px; border-radius: 10px; border: 1px solid #D2D2D7;
            background: white; cursor: pointer; font-weight: 700;
        }
        .page-link.active { background: var(--apple-blue); color: white; border-color: var(--apple-blue); }

        #lightbox { 
        display: none; 
        position: fixed; 
        inset: 0; 
        background: rgba(0,0,0,0.85); 
        backdrop-filter: blur(10px); /* Effetto sfocato stile Apple */
        z-index: 9999; 
        justify-content: center; 
        align-items: center; 
        cursor: zoom-out;
    }
    
    #fullPhoto { 
        max-width: 90%; 
        max-height: 85%; 
        border-radius: 20px; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        border: 4px solid white;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #lightbox:hover #fullPhoto {
        transform: scale(1.02);
    }
    </style>
</head>
<body>

<div id="lightbox" onclick="this.style.display='none'"><img id="fullPhoto" src="" style="max-width: 90%; max-height: 90%; border-radius: 20px;"></div>

<aside class="sidebar">
    <div class="sidebar-header">RoadTag <span style="color:var(--apple-blue)">Asti</span></div>
    <div class="nav-item active" onclick="setFilter('all', this)">📊 Tutti i Rapporti</div>
    <div class="nav-item" onclick="setFilter('pending', this)">⚠️ Pericoli Attivi</div>
    <div class="nav-item" onclick="setFilter('resolved', this)">✅ Lavori Risolti</div>
    <div style="margin-top:auto; padding: 30px;">
        <button onclick="exportExcel()" style="width:100%; padding:15px; border-radius:14px; border:none; background:var(--apple-blue); color:white; font-weight:700; cursor:pointer; box-shadow: 0 4px 12px rgba(0,122,255,0.3);">📥 Esporta Excel</button>
    </div>
</aside>

<main class="main-content">
    <div class="toolbar">
        <button class="page-link" onclick="document.body.classList.toggle('menu-closed')">☰</button>
        <input type="text" id="searchInput" class="input-box" placeholder="Cerca via..." onkeyup="updateTable()">
        
        <input type="date" id="dateInput" class="input-box" onchange="updateTable()">
        
        <select id="rowsPerPage" class="input-box" onchange="currentPage=1; updateTable()">
            <option value="5">05 per pagina</option>
            <option value="10" selected>10 per pagina</option>
            <option value="20">20 per pagina</option>
            <option value="50">50 per pagina</option>
            <option value="100">100 per pagina</option>
            <option value="999999">Mostra Tutti</option>
        </select>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th style="width: 120px;">Foto</th>
                    <th>Via <button class="sort-btn" onclick="setSort('road')">↕</button></th>
                    <th>Data <button class="sort-btn" onclick="setSort('timestamp')">↕</button></th>
                    <th>Stato <button class="sort-btn" onclick="setSort('status')">↕</button></th>
                    <th style="text-align:middle;">Azioni</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="pager-row">
        <div id="pageInfo" style="font-weight: 600; color: #86868B;"></div>
        <div id="pageNumbers" style="display:flex; gap:8px;"></div>
    </div>
</main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
        authDomain: "italy-road-reporter.firebaseapp.com",
        projectId: "italy-road-reporter",
        databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
        storageBucket: "italy-road-reporter.firebasestorage.app",
        messagingSenderId: "480453082341",
        appId: "1:480453082341:web:7cd51e2256747f1003280c"
    };

    firebase.initializeApp(firebaseConfig);
    const reportsRef = firebase.database().ref('reports');

    let masterData = [];
    let currentFilter = 'all';
    let currentPage = 1;
    let currentSort = { key: 'timestamp', asc: false };

    function init() {
        reportsRef.on('value', snap => {
            const val = snap.val();
            masterData = val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : [];
            updateTable();
        });
    }

    function setSort(key) {
        currentSort.asc = (currentSort.key === key) ? !currentSort.asc : true;
        currentSort.key = key;
        updateTable();
    }

    function updateTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const dateVal = document.getElementById('dateInput').value;
        const rowsCount = parseInt(document.getElementById('rowsPerPage').value);

        let filtered = masterData.filter(i => {
            const mSearch = i.road.toLowerCase().includes(query);
            const mStatus = (currentFilter === 'all') || (currentFilter === 'resolved' ? i.status === 'resolved' : i.status !== 'resolved');
            const mDate = !dateVal || (new Date(i.timestamp).toISOString().split('T')[0] === dateVal);
            return mSearch && mStatus && mDate;
        });

        filtered.sort((a,b) => {
            let v1 = a[currentSort.key] || '', v2 = b[currentSort.key] || '';
            return currentSort.asc ? (v1 > v2 ? 1 : -1) : (v1 < v2 ? 1 : -1);
        });

        const total = filtered.length;
        const pages = Math.ceil(total / rowsCount);
        const start = (currentPage - 1) * rowsCount;
        
        render(filtered.slice(start, start + rowsCount));
        renderPager(total, pages);
    }

    function render(list) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = list.map(item => `
            <tr>
                <td>
                    <div class="img-box" style="border: 2px solid #E8E8ED; transition: 0.2s;" 
                         onmouseover="this.style.borderColor='var(--apple-blue)'" 
                         onmouseout="this.style.borderColor='#E8E8ED'">
                        ${item.image ? 
                            `<img src="${item.image}" 
                                  onclick="openPhoto('${item.image}')" 
                                  title="Clicca per ingrandire" 
                                  style="cursor: zoom-in;">` : 
                            `<small style="color:#D2D2D7">No Foto</small>`
                        }
                    </div>
                </td>
                <td>
                    <div style="font-weight:700; font-size:1.1rem;">${item.road}</div>
                    <div style="font-size:0.8rem; color:#86868B;">Coordinate: ${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}</div>
                </td>
                <td style="font-weight:600; color:#424245;">${new Date(item.timestamp).toLocaleDateString('it-IT')}</td>
                <td>
                    <span style="color:${item.status==='resolved'? 'var(--apple-success)' : 'var(--apple-danger)'}; font-weight:800; font-size:0.85rem;">
                        ● ${item.status==='resolved'?'RISOLTO':'ATTIVO'}
                    </span>
                </td>
                <td>
                    <div class="action-cell">
                        <div style="width:50px">
                            ${item.status !== 'resolved' ? `<button class="ui-btn btn-ok" onclick="act('${item.id}','upd')">OK</button>` : ''}
                        </div>
                        <button class="ui-btn btn-del" onclick="act('${item.id}','del')">✕</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function renderPager(total, pages) {
        document.getElementById('pageInfo').innerText = `Record: ${total} | Pagina ${currentPage} di ${pages || 1}`;
        let html = "";
        // Se mostriamo tutti, non serve il pager numerico
        if(pages > 1 && pages < 50) {
            for(let i=1; i<=pages; i++) {
                html += `<button class="page-link ${i===currentPage?'active':''}" onclick="currentPage=${i}; updateTable()">${i}</button>`;
            }
        }
        document.getElementById('pageNumbers').innerHTML = html;
    }

    function act(id, type) {
        if(prompt("Asti Admin Password:") !== "Asti123") return;
        if(type === 'upd') reportsRef.child(id).update({status:'resolved'});
        else if(confirm("Cancellare definitivamente questa segnalazione?")) reportsRef.child(id).remove();
    }

    function setFilter(t, el) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        currentFilter = t; currentPage = 1; updateTable();
    }

    function openPhoto(s) { document.getElementById('fullPhoto').src=s; document.getElementById('lightbox').style.display='flex'; }

    function exportExcel() {
        try {
            const data = masterData.map(i => ({
                Via: i.road,
                Lat: i.lat,
                Lng: i.lng,
                Data: new Date(i.timestamp).toLocaleString('it-IT'),
                Stato: i.status === 'resolved' ? 'Risolto' : 'Attivo',
                Nota: i.note || '',
                Immagine: i.image
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Asti_Report");
            XLSX.writeFile(wb, "Report_Strade_Asti_" + new Date().toLocaleDateString() + ".xlsx");
        } catch (e) { alert("Errore Export: " + e.message); }
    }

    init();
</script>
</body>
</html>
