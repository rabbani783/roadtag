<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asti RoadTag | Pannello Amministratore</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --sidebar-w: 260px;
            --primary-dark: #1a2a6c;
            --accent-blue: #0052cc;
            --success-green: #107c10;
            --danger-red: #d11a2a;
            --bg-light: #f4f7f9;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-light); color: #333; display: flex; min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-w); background: var(--primary-dark);
            color: white; height: 100vh; position: fixed; left: 0;
            transition: 0.3s ease; display: flex; flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1); z-index: 1000;
        }
        body.menu-closed .sidebar { transform: translateX(-100%); }
        body.menu-closed .main-content { margin-left: 0; width: 100%; }

        .sidebar-header { padding: 30px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .nav-item {
            padding: 18px 25px; cursor: pointer; color: #cbd5e0;
            border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 600;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
        }
        .nav-item:hover, .nav-item.active { color: white; background: var(--accent-blue); }

        /* --- CONTENUTO PRINCIPALE --- */
        .main-content {
            margin-left: var(--sidebar-w); width: calc(100% - var(--sidebar-w));
            padding: 30px; transition: all 0.3s ease; box-sizing: border-box;
        }

        .top-row { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        .burger-btn { background: var(--primary-dark); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
        .search-bar { padding: 12px 20px; width: 100%; max-width: 450px; border: 2px solid #cbd5e0; border-radius: 10px; font-size: 1rem; }

        /* --- TABELLA --- */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th { background: #f8fafc; padding: 15px; text-align: left; font-size: 0.75rem; color: #444; text-transform: uppercase; border-bottom: 3px solid #e2e8f0; cursor: pointer; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 1rem; vertical-align: middle; }
        
        .coord-link { color: var(--accent-blue); font-family: monospace; font-size: 0.85rem; text-decoration: none; font-weight: bold; }
        .coord-link:hover { text-decoration: underline; }

        .btn { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-success { background: var(--success-green); color: white; margin-right: 5px; }
        .btn-danger { background: white; color: var(--danger-red); border: 1px solid var(--danger-red); }

        .badge { padding: 5px 10px; border-radius: 4px; font-weight: 800; font-size: 0.75rem; }
        .badge-urgent { background: #fee2e2; color: #b91c1c; }
        .badge-fixed { background: #dcfce7; color: #15803d; }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="lightbox" onclick="this.style.display='none'"><img id="fullPhoto" src="" style="max-width: 90%; max-height: 90%; border: 4px solid white; border-radius: 10px;"></div>

<aside class="sidebar">
    <div class="sidebar-header">
        <h2 style="margin:0">RoadTag Asti</h2>
        <p style="font-size: 0.75rem; opacity: 0.7; margin:5px 0 0">Console Amministrativa</p>
    </div>
    <div class="nav-item active" onclick="filterBy('all', this)">📊 Tutti i Rapporti</div>
    <div class="nav-item" onclick="filterBy('pending', this)">⚠️ Pericoli Attivi</div>
    <div class="nav-item" onclick="filterBy('resolved', this)">✅ Lavori Risolti</div>
    <div class="nav-item" onclick="exportExcel()" style="color: #4ade80; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">📥 Esporta Excel (.xlsx)</div>
    <div class="nav-item" onclick="window.open('index.html', '_blank')" style="margin-top: auto;">🚀 Vai alla Mappa</div>
</aside>

<main class="main-content">
    <div class="top-row">
        <button class="burger-btn" onclick="document.body.classList.toggle('menu-closed')">☰</button>
        <input type="text" id="searchInput" class="search-bar" placeholder="Cerca via o note..." onkeyup="handleSearch()">
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Foto</th>
                    <th onclick="resortData('road')">Via ↕</th>
                    <th>Coordinate</th>
                    <th onclick="resortData('timestamp')">Data ↕</th>
                    <th onclick="resortData('status')">Stato ↕</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</main>

<script>
    // Configurazione Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
        authDomain: "italy-road-reporter.firebaseapp.com",
        projectId: "italy-road-reporter",
        databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
        storageBucket: "italy-road-reporter.firebasestorage.app",
        messagingSenderId: "480453082341",
        appId: "1:480453082341:web:7cd51e2256747f1003280c"
    };

    firebase.initializeApp(firebaseConfig);
    const reportsRef = firebase.database().ref('reports');
    
    let masterData = [];
    let currentSort = { key: 'timestamp', asc: false };

    // Inizializzazione dati
    function init() {
        reportsRef.on('value', snap => {
            const val = snap.val();
            masterData = val ? Object.keys(val).map(k => ({ id: k, ...val[k] })) : [];
            render(masterData);
        });
    }

    // Funzione di ordinamento
    function resortData(key) {
        currentSort.asc = (currentSort.key === key) ? !currentSort.asc : true;
        currentSort.key = key;
        render(masterData);
    }

    // Funzione di filtraggio (Risolve l'errore "filterBy is not defined")
    function filterBy(type, el) {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        
        if (type === 'all') {
            render(masterData);
        } else if (type === 'resolved') {
            render(masterData.filter(i => i.status === 'resolved'));
        } else {
            render(masterData.filter(i => i.status !== 'resolved'));
        }
    }

    // Rendering della Tabella
    function render(dataList) {
        let sorted = [...dataList].sort((a, b) => {
            let v1 = a[currentSort.key] || '', v2 = b[currentSort.key] || '';
            if (currentSort.key === 'road') return currentSort.asc ? v1.localeCompare(v2) : v2.localeCompare(v1);
            return currentSort.asc ? v1 - v2 : v2 - v1;
        });

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = sorted.map(item => `
            <tr>
                <td>${item.image ? `<img src="${item.image}" width="55" style="border-radius:6px; cursor:pointer" onclick="openPhoto('${item.image}')">` : '—'}</td>
                <td><strong>${item.road}</strong><br><small style="color:#666">${item.note || ''}</small></td>
                <td>
                    <a href="https://www.google.com/maps?q=${item.lat},${item.lng}" target="_blank" class="coord-link">
                        ${item.lat ? item.lat.toFixed(5) : '0'}, ${item.lng ? item.lng.toFixed(5) : '0'}
                    </a>
                </td>
                <td>${new Date(item.timestamp).toLocaleDateString('it-IT')}</td>
                <td><span class="badge ${item.status==='resolved'?'badge-fixed':'badge-urgent'}">${item.status==='resolved'?'RISOLTO':'ATTIVO'}</span></td>
                <td>
                    <div style="display:flex">
                        ${item.status !== 'resolved' ? `<button class="btn btn-success" onclick="updateStatus('${item.id}', 'resolved')">OK</button>` : ''}
                        <button class="btn btn-danger" onclick="deleteItem('${item.id}')">X</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        render(masterData.filter(i => i.road.toLowerCase().includes(query) || (i.note && i.note.toLowerCase().includes(query))));
    }

    function updateStatus(id, status) {
        if (prompt("Password Amministratore:") === "Asti123") {
            reportsRef.child(id).update({ status });
        }
    }

    function deleteItem(id) {
        if (confirm("Sei sicuro di voler eliminare questo rapporto ad Asti?")) {
            if (prompt("Inserire password di sicurezza:") === "Asti123") {
                reportsRef.child(id).remove();
            }
        }
    }

    function openPhoto(src) {
        document.getElementById('fullPhoto').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function exportExcel() {
        const rows = masterData.map(i => ({
            Via: i.road,
            Note: i.note || '',
            Latitudine: i.lat,
            Longitudine: i.lng,
            Data: new Date(i.timestamp).toLocaleString('it-IT'),
            Stato: i.status === 'resolved' ? 'Risolto' : 'Attivo'
        }));
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Report_Strade_Asti");
        XLSX.writeFile(wb, "Asti_Report_Tecnico.xlsx");
    }

    // Avvio
    init();
</script>
</body>
</html>
