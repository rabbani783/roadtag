<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoadTag Admin | Asti</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #2c3e50; --danger: #e74c3c; --success: #27ae60; --warning: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: var(--primary); }
        
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        
        /* Stats Section */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .card h3 { margin: 0; font-size: 14px; color: #7f8c8d; }
        .card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; }

        /* Tables */
        h2 { font-size: 1.2rem; margin: 30px 0 15px; display: flex; align-items: center; }
        .section-active h2 { color: var(--danger); }
        .section-resolved h2 { color: var(--success); }
        
        .table-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; font-size: 13px; text-transform: uppercase; }
        
        .thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 2px solid #eee; transition: 0.2s; }
        .thumb:hover { border-color: #3498db; transform: scale(1.05); }

        /* Buttons */
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-resolve { background: var(--success); color: white; }
        .btn-resolve:hover { background: #219150; }

        /* Photo Lightbox Overlay */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; cursor: pointer; }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="lightbox" onclick="this.style.display='none'"><img id="fullPhoto" src=""></div>

<div class="container">
    <div class="header">
        <h1>Dashboard: Provincia di Asti</h1>
        <button class="btn" style="background: var(--primary); color: white;" onclick="window.location.href='index.html'">Open Map</button>
    </div>

    <div class="stats-bar">
        <div class="card"><h3>Active Issues</h3><p id="count-active" style="color: var(--danger);">0</p></div>
        <div class="card"><h3>Resolved</h3><p id="count-resolved" style="color: var(--success);">0</p></div>
        <div class="card"><h3>Total Tracked</h3><p id="count-total">0</p></div>
    </div>

    <div class="section-active">
        <h2>⚠️ Active Road Hazards</h2>
        <div class="table-container">
            <table>
                <thead><tr><th>Photo</th><th>Location</th><th>Note</th><th>Date</th><th>Action</th></tr></thead>
                <tbody id="active-body"></tbody>
            </table>
        </div>
    </div>

    <div class="section-resolved">
        <h2>✅ Resolved Reports (Archive)</h2>
        <div class="table-container">
            <table>
                <thead><tr><th>Photo</th><th>Location</th><th>Note</th><th>Fixed Date</th></tr></thead>
                <tbody id="resolved-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- FIREBASE SETUP ---
    const firebaseConfig = {
        apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
        authDomain: "italy-road-reporter.firebaseapp.com",
        projectId: "italy-road-reporter",
        databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
        storageBucket: "italy-road-reporter.firebasestorage.app",
        messagingSenderId: "480453082341",
        appId: "1:480453082341:web:7cd51e2256747f1003280c"
    };

    firebase.initializeApp(firebaseConfig);
    const reportsRef = firebase.database().ref('reports');

    function showPhoto(src) {
        document.getElementById('fullPhoto').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function refreshData() {
        reportsRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const activeBody = document.getElementById('active-body');
            const resolvedBody = document.getElementById('resolved-body');
            
            activeBody.innerHTML = "";
            resolvedBody.innerHTML = "";

            let activeCount = 0, resolvedCount = 0;

            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    const item = data[key];
                    const dateStr = new Date(item.timestamp).toLocaleDateString('it-IT');
                    const imgTag = item.image ? `<img src="${item.image}" class="thumb" onclick="showPhoto(this.src)">` : 'No Photo';

                    if (item.status === 'resolved') {
                        resolvedCount++;
                        resolvedBody.innerHTML += `
                            <tr style="opacity: 0.7;">
                                <td>${imgTag}</td>
                                <td><b>${item.road}</b></td>
                                <td>${item.note || '-'}</td>
                                <td>${dateStr}</td>
                            </tr>
                        `;
                    } else {
                        activeCount++;
                        activeBody.innerHTML += `
                            <tr>
                                <td>${imgTag}</td>
                                <td><b>${item.road}</b></td>
                                <td>${item.note || '-'}</td>
                                <td>${dateStr}</td>
                                <td><button class="btn btn-resolve" onclick="resolveIssue('${key}')">Mark Resolved</button></td>
                            </tr>
                        `;
                    }
                });
            }

            document.getElementById('count-active').innerText = activeCount;
            document.getElementById('count-resolved').innerText = resolvedCount;
            document.getElementById('count-total').innerText = activeCount + resolvedCount;
        });
    }

    function resolveIssue(key) {
        const secret = prompt("Confirm Resolution Password:");
        if (secret === "Asti123") {
            reportsRef.child(key).update({ 
                status: 'resolved',
                resolvedAt: Date.now() 
            });
        }
    }

    refreshData();
</script>
</body>
</html>
