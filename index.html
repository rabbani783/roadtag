<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Italy Road Hazard Reporter</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow: hidden; background: #2c3e50; }
        #map { height: 100vh; width: 100vw; z-index: 1; background-color: #ddd; }
        .fab-container { position: fixed; bottom: 30px; width: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; z-index: 1000; }
        .fab { pointer-events: auto; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .btn-report { width: 80px; height: 80px; background-color: #e74c3c; color: white; border-radius: 50%; font-size: 35px; font-weight: bold; }
        .btn-location { position: absolute; right: 20px; width: 55px; height: 55px; background-color: white; border-radius: 50%; font-size: 24px; color: #333; }
        .popup-form { color: #333; min-width: 220px; padding: 5px; }
        .road-label { font-weight: bold; color: #e74c3c; display: block; margin-bottom: 5px; font-size: 14px; }
        .preview-img { width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #ccc; }
        .save-btn { background: #27ae60; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; margin-top: 10px; font-weight: bold; cursor: pointer; }
        #hiddenCameraInput { display: none; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="map"></div>

    <div class="fab-container">
        <button class="fab btn-report" onclick="verifyLocationThenCamera()">+</button>
        <button class="fab btn-location" onclick="requestLocation(true)">🎯</button>
    </div>

    <input type="file" id="hiddenCameraInput" accept="image/*" capture="camera" onchange="handleCameraUpload(event)">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCOzpc3cX32FQL8vZxNMi5nAvfdlWwLKrU",
            authDomain: "italy-road-reporter.firebaseapp.com",
            projectId: "italy-road-reporter",
            databaseURL: "https://italy-road-reporter-default-rtdb.europe-west1.firebasedatabase.app/",
            storageBucket: "italy-road-reporter.firebasestorage.app",
            messagingSenderId: "480453082341",
            appId: "1:480453082341:web:7cd51e2256747f1003280c"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const reportsRef = database.ref('reports');

        const italyCenter = [41.8719, 12.5674];
        let map, currentUserPos = null;

        function initApp() {
            try {
                const savedLoc = JSON.parse(localStorage.getItem('lastLocation'));
                const startPos = savedLoc ? [savedLoc.lat, savedLoc.lng] : italyCenter;
                
                map = L.map('map', { zoomControl: false }).setView(startPos, savedLoc ? 15 : 6);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                    maxZoom: 19,
                    attribution: '© OSM'
                }).addTo(map);

                map.on('click', (e) => processLocation(e.latlng, 'manual'));
                
                reportsRef.on('child_added', (snapshot) => {
                    addMarkerToMap(snapshot.val(), snapshot.key);
                });

                reportsRef.on('child_removed', () => {
                    location.reload(); 
                });

                requestLocation(false);
            } catch (e) { 
                console.error(e);
            }
        }

        function addMarkerToMap(data, key) {
            const iconHtml = data.image 
                ? `<div style="width:40px; height:40px; border-radius:50%; border:3px solid white; background-image:url('${data.image}'); background-size:cover; background-position:center; box-shadow: 0 2px 5px rgba(0,0,0,0.5);"></div>`
                : `<div style="width:20px; height:20px; background-color:#3498db; border-radius:50%; border:2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>`;

            const customIcon = L.divIcon({
                html: iconHtml,
                className: 'custom-icon',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });

            const marker = L.marker([data.lat, data.lng], { icon: customIcon }).addTo(map);

            let content = `<div class="popup-form">`;
            content += `<span class="road-label">📍 ${data.road}</span>`;
            if (data.image) content += `<img src="${data.image}" class="preview-img">`;
            if (data.note) content += `<p><b>Note:</b> ${data.note}</p>`;
            content += `<hr><button onclick="deleteReport('${key}')" style="background:none; border:none; color:#e74c3c; cursor:pointer; font-size:11px; width:100%;">🗑️ Delete</button>`;
            content += `</div>`;
            marker.bindPopup(content);
        }

        function deleteReport(firebaseKey) {
            const secret = prompt("Password:");
            if (secret === "Asti123") {
                reportsRef.child(firebaseKey).remove();
            } else {
                alert("Wrong password.");
            }
        }

        async function processLocation(latlng, type, imageData = null) {
            const osrmUrl = `https://router.project-osrm.org/nearest/v1/driving/${latlng.lng},${latlng.lat}?number=1`;
            try {
                const res = await fetch(osrmUrl);
                const data = await res.json();
                const snapped = data.waypoints[0].location
