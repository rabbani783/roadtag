<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Italy Road Hazard Reporter</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="map"></div>

    <div class="fab-container">
        <button class="fab btn-report" onclick="verifyLocationThenCamera()">+</button>
        <button class="fab btn-location" onclick="requestLocation(true)">🎯</button>
    </div>

    <input type="file" id="hiddenCameraInput" accept="image/*" capture="camera" onchange="handleCameraUpload(event)">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
	<div style="position: fixed; top: 10px; left: 10px; z-index: 1000; background: white; padding: 5px 10px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-weight: bold; color: #2c3e50; display: flex; align-items: center;">
    <span style="color: #e74c3c; margin-right: 5px;">📍</span> Asti RoadTag
	<div id="lightbox" onclick="if(event.target === this) closeLightbox()" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 2000; justify-content: center; align-items: center; padding: 20px;">
    <div class="modal-content" style="display: flex; flex-direction: column; background: white; border-radius: 28px; width: 95%; max-width: 500px; max-height: 90vh; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.4); font-family: -apple-system, system-ui, sans-serif;">
        
        <div style="background: #000; position: relative; height: 300px; display: flex; align-items: center; justify-content: center;">
            <img id="fullPhoto" src="" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            <button onclick="closeLightbox()" style="position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-weight: bold;">✕</button>
        </div>

        <div style="padding: 25px; display: flex; flex-direction: column; gap: 15px;">
            <div id="modalInfo" style="font-size: 1.1rem; font-weight: 700; color: #1D1D1F; margin-bottom: 5px;">Unknown Location</div>
            
            <label style="font-size: 0.8rem; color: #86868B; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Damage Severity (IT Standard)</label>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="sev-btn" data-sev="lieve" onclick="updateSev('lieve', this)" style="background: #E8F5E9; color: #2E7D32; border: 2px solid transparent; height: 50px; border-radius: 12px; font-weight: 700; cursor: pointer;">Lieve (Minor)</button>
                <button class="sev-btn" data-sev="medio" onclick="updateSev('medio', this)" style="background: #FFF3E0; color: #EF6C00; border: 2px solid transparent; height: 50px; border-radius: 12px; font-weight: 700; cursor: pointer;">Medio (Medium)</button>
                <button class="sev-btn" data-sev="grave" onclick="updateSev('grave', this)" style="background: #FFEBEE; color: #C62828; border: 2px solid transparent; height: 50px; border-radius: 12px; font-weight: 700; cursor: pointer;">Grave (Serious)</button>
                <button class="sev-btn" data-sev="critico" onclick="updateSev('critico', this)" style="background: #212121; color: #FFFFFF; border: 2px solid #D32F2F; height: 50px; border-radius: 12px; font-weight: 700; cursor: pointer;">CRITICO</button>
            </div>

            <button onclick="closeLightbox()" style="margin-top: 10px; height: 50px; background: #007AFF; color: white; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 1rem;">Confirm & Save</button>
        </div>
    </div>
</div>
</div>
</body>
</html>
