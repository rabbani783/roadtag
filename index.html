<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Italy Road Hazard Reporter</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- Main Map Container -->
    <div id="map"></div>

    <!-- App Glassmorphic Header Badge -->
    <div class="app-header-badge">
        <span class="app-badge-dot" id="connectionStatus"></span>
        <span>Asti RoadTag</span>
    </div>

    <!-- Bottom Actions (FAB) -->
    <div class="fab-container">
        <button class="fab btn-report" onclick="verifyLocationThenCamera()" title="Segnala con Foto">+</button>
        <button class="fab btn-location" onclick="requestLocation(true)" title="La mia posizione">🎯</button>
    </div>

    <!-- Hidden Camera File Input -->
    <input type="file" id="hiddenCameraInput" accept="image/*" capture="camera" onchange="handleCameraUpload(event)">

    <!-- Interactive Lightbox Modal -->
    <div id="lightbox" onclick="if(event.target === this) closeLightbox()">
        <div class="modal-content">
            <div class="modal-image-container">
                <img id="fullPhoto" src="" alt="Foto Danno">
                <button class="modal-close-btn" onclick="closeLightbox()">✕</button>
            </div>
            <div class="modal-details">
                <div class="modal-road-title" id="modalInfo">Unknown Location</div>
                <div class="modal-meta" id="modalMeta">Caricamento coordinate...</div>
                
                <label class="modal-label">Livello di Gravità</label>
                <div class="severity-grid">
                    <button class="sev-btn" data-sev="none" onclick="updateSev('none', this)">Nessun Danno</button>
                    <button class="sev-btn" data-sev="lieve" onclick="updateSev('lieve', this)">Lieve</button>
                    <button class="sev-btn" data-sev="medio" onclick="updateSev('medio', this)">Medio</button>
                    <button class="sev-btn" data-sev="grave" onclick="updateSev('grave', this)">Grave</button>
                    <button class="sev-btn" data-sev="critico" onclick="updateSev('critico', this)">Critico</button>
                </div>

                <button class="confirm-btn" onclick="closeLightbox()">Salva e Chiudi</button>
            </div>
        </div>
    </div>

    <!-- Script imports -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
